# Tower of Heaven settings. Delete a line (or this whole file) to get the original game.

# How many times a second the screen is redrawn: 30, 60 or 120. The game itself always runs at
# 30 frames a second like the original; this keeps every frame on screen for the same time, which
# avoids judder. Higher values can lower input lag a little and use a bit more power. If your
# screen can't do the rate you pick, the nearest one it can do is used.
refresh = 120

# Title menu: pressing right slides the options to the right, and left to the left.
# (The original slides them the other way.) 0 = original.
menu_slide_follows_direction = 1
